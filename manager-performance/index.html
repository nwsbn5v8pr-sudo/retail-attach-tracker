<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Manager Performance</title><style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#17252a;--muted:#687276;--forest:#174f43;--sage:#78a892;--sage2:#e5f0e8;--amber:#e5a83b;--amber2:#fff0d1;--coral:#d95c55;--coral2:#fbe4e1;--line:#e7e1d8;--shadow:0 8px 26px rgba(30,45,41,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}.app{display:flex;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#f4f0e8;border-right:1px solid var(--line);padding:28px 14px;z-index:2}.brand{font-weight:800;font-size:19px;line-height:1.02;padding:0 14px 25px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;margin-top:8px}.nav{width:100%;border:0;background:none;text-align:left;padding:12px 13px;border-radius:11px;color:#384347;font-weight:650;margin:3px 0}.nav.active{background:#dce9de;color:var(--forest)}main{margin-left:220px;width:calc(100% - 220px);padding:30px;max-width:1450px}.page{display:none}.page.active{display:block}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:15px}h1{font-size:40px;letter-spacing:-1.7px;line-height:1.05;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}.week,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.week{padding:11px 14px;font-size:12px;color:var(--muted)}.week b{display:block;color:var(--ink);margin-top:3px}.pad{padding:19px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{min-height:155px}.kpi b{font-size:14px}.metric{font-size:30px;font-weight:800;letter-spacing:-1px;margin:14px 0 2px}.goal{font-size:12px;color:var(--muted)}.bar{height:8px;background:#e4e9e5;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--sage);border-radius:20px}.bar i.warn{background:var(--amber)}.bar i.bad{background:var(--coral)}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.attention{background:#fff9f6}.label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--forest)}.attn{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #efe7df;border-radius:12px;padding:11px;margin-top:8px}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#f7c9c3;color:#a7463e}.num.amber{background:#f9e1ad;color:#8c6418}.attn small{display:block;color:var(--muted);margin-top:2px}.focus{min-height:245px;background:#eef4ef;border-color:#dce8df;display:flex;flex-direction:column;justify-content:center}.focus h2{font-size:31px;line-height:1.08;letter-spacing:-1px;margin:12px 0 9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini div{background:#f8f7f3;border-radius:12px;padding:14px}.mini strong{font-size:24px;display:block}.mini span{font-size:12px;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.head h2{font-size:19px;margin:0}.head p{font-size:12px;color:var(--muted);margin:3px 0 0}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--forest);color:#fff;font-weight:750}.btn.alt{background:#edf2ed;color:var(--forest)}.btn.danger{background:var(--coral2);color:#a3433d}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:12px}th{background:#faf8f4;color:#747c79;font-size:10px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border:0}input,select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;width:100%}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800}.good{background:var(--sage2);color:#28614e}.warn{background:var(--amber2);color:#8b6419}.bad{background:var(--coral2);color:#a3433d}.check{width:18px;height:18px;border:1.5px solid #9aa19d;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:9px}.action{padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.action:last-child{border:0}.huddle{padding:25px;background:#f3ece6;border:1px solid #e9ddd3;border-radius:14px}.huddle h2{font-size:32px;line-height:1.08;margin:10px 0}.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.hbox{padding:17px;border-radius:13px;background:#f4f7f0}.hbox:nth-child(2){background:#fff4df}.hbox b{display:block;font-size:11px;color:#6c746f;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}.notice{padding:12px 14px;border-radius:11px;background:#f3f5f2;color:#53605c;font-size:12px;margin-top:12px}
@media(max-width:1000px){.side{width:185px}.nav{font-size:12px}main{margin-left:185px;width:calc(100% - 185px);padding:20px}.grid4{grid-template-columns:repeat(2,1fr)}.split,.two{grid-template-columns:1fr}}
@media(max-width:700px){.app{display:block}.side{position:static;width:100%;padding:12px;height:auto}.brand{padding:3px 10px 12px}main{margin:0;width:100%;padding:15px}.nav{display:inline-block;width:24%;text-align:center;font-size:11px}.top{display:block}h1{font-size:32px}.week{margin-top:10px}.grid4{grid-template-columns:1fr 1fr}.hgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Manager<br>Performance<small>KNOW · COACH · ACT</small></div><div id="nav"></div></aside><main><div id="pages"></div></main></div><script>
const S="mpv1";let d=JSON.parse(localStorage.getItem(S)||"null")||{manager:"Alex Manager",salesGoal:50000,convGoal:20,atvGoal:85,cxGoal:90,k:[{sales:9200,conv:18,atv:89,cx:92},{sales:9800,conv:17,atv:84,cx:90},{sales:9500,conv:18,atv:90,cx:94}],team:[["Alex Johnson","On Track","Customer Engagement",85],["Mike Carter","Need Coaching","Sales Process",62],["Sarah Lee","On Track","Product Knowledge",95],["Tom Davis","On Track","Customer Experience",78],["Lisa Brown","Need Training","Conversion",68]],coach:[["Alex Johnson","Customer Engagement","Practice questions","10/02","On Track"],["Mike Carter","Sales Process","Review steps","10/06","Follow Up"],["Sarah Lee","Product Knowledge","Build confidence","10/05","Overdue"]],train:[["Alex Johnson","Product Knowledge",85,"In Progress","10/05"],["Mike Carter","Customer Engagement",62,"Not Started","10/06"],["Sarah Lee","Leadership",95,"Completed","10/01"],["Tom Davis","Sales Process",78,"In Progress","10/08"],["Lisa Brown","Customer Experience",68,"In Progress","10/07"]],h:["Win the first 30 seconds.","Greet quickly. Ask a discovery question. Identify the customer’s goal.","3 quality customer engagements per person.","Sarah — strongest customer-experience performance yesterday."]};function save(){localStorage.setItem(S,JSON.stringify(d))}function money(n){return"$"+Math.round(n).toLocaleString()}function avg(k){return d.k.reduce((a,x)=>a+x[k],0)/d.k.length}function cls(a,g){return a/g>=1?"good":a/g>=.9?"warn":"bad"}function top(t,s){return'<div class="top"><div><h1>'+t+'</h1><div class="sub">'+s+'</div></div><div class="week">Reporting week<b>Sep 28 – Oct 4, 2026</b></div></div>'}function k(n,v,g,kind){let p=v/g*100;return'<div class="card pad kpi"><b>'+n+'</b><div class="metric">'+(kind==="money"?money(v):kind==="atv"?"$"+v.toFixed(0):v.toFixed(1)+"%")+'</div><div class="goal">'+(kind==="money"?money(g):kind==="atv"?"$"+g:g+"%")+' goal</div><div class="bar"><i class="'+cls(v,g)+'" style="width:'+Math.min(100,p)+'%"></i></div></div>'}
function dash(){let sales=d.k.reduce((a,x)=>a+x.sales,0),c=avg("conv"),a=avg("atv"),cx=avg("cx");let at=[];if(c<d.convGoal)at.push(["Conversion",(d.convGoal-c).toFixed(1)+" points below goal"]);if(sales<d.salesGoal)at.push(["Sales",money(d.salesGoal-sales)+" remaining to weekly goal"]);if(d.train.some(x=>x[3]!=="Completed"))at.push(["Training",d.train.filter(x=>x[3]!=="Completed").length+" assignments still open"]);if(d.coach.some(x=>x[4]==="Overdue"))at.push(["Coaching","1 follow-up needs attention"]);return top("Good Morning, "+d.manager+"!","PEOPLE · PERFORMANCE · PROGRESS")+'<div class="grid4">'+k("Sales",sales,d.salesGoal,"money")+k("Conversion",c,d.convGoal)+k("Avg. Transaction",a,d.atvGoal,"atv")+k("Customer Experience",cx,d.cxGoal)+'</div><div class="split"><div class="card pad attention"><b style="color:#a74d42;font-size:12px;letter-spacing:.08em">WHAT NEEDS ATTENTION</b>'+at.slice(0,3).map((x,i)=>'<div class="attn"><span class="num '+(i?'amber':'')+'">'+(i+1)+'</span><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div><span>›</span></div>').join("")+'</div><div class="card pad focus"><div class="label">TODAY’S FOCUS</div><h2>'+d.h[0]+'</h2><div class="sub">'+d.h[1]+'</div></div></div><div class="two"><div class="card pad"><div class="head"><div><h2>Team at a glance</h2><p>'+d.team.length+' team members</p></div></div><div class="mini"><div><strong>'+d.team.filter(x=>x[1]==="On Track").length+'</strong><span>On Track</span></div><div><strong>'+d.team.filter(x=>x[1]==="Need Coaching").length+'</strong><span>Need Coaching</span></div><div><strong>'+d.team.filter(x=>x[1]==="Need Training").length+'</strong><span>Need Training</span></div></div></div><div class="card pad"><div class="head"><div><h2>Today’s key actions</h2><p>Keep it short. Keep it moving.</p></div></div><div class="action"><span class="check"></span>Review yesterday’s results</div><div class="action"><span class="check"></span>Share today’s focus</div><div class="action"><span class="check"></span>Ask for team commitments</div></div></div>'}
function daily(){return top("Daily KPI Tracker","Track progress. Spot trends. Take action.")+'<div class="card pad"><div class="head"><div><h2>Daily results</h2><p>Edit a number and the Dashboard updates automatically.</p></div><button class="btn" onclick="addK()">+ Add Day</button></div><div class="table"><table><tr><th>Day</th><th>Sales</th><th>Conversion</th><th>Avg. Transaction</th><th>CX</th></tr>'+d.k.map((x,i)=>'<tr><td>Day '+(i+1)+'</td><td><input type="number" value="'+x.sales+'" onchange="d.k['+i+'].sales=+this.value;save();render()"></td><td><input type="number" step=".1" value="'+x.conv+'" onchange="d.k['+i+'].conv=+this.value;save();render()"></td><td><input type="number" step=".1" value="'+x.atv+'" onchange="d.k['+i+'].atv=+this.value;save();render()"></td><td><input type="number" step=".1" value="'+x.cx+'" onchange="d.k['+i+'].cx=+this.value;save();render()"></td></tr>').join("")+'</table></div></div>'}
function team(){return top("Team","Know who needs you — without digging through a spreadsheet.")+'<div class="card pad"><div class="head"><div><h2>Team overview</h2><p>Performance, focus and training in one view.</p></div><button class="btn" onclick="addT()">+ Add Team Member</button></div><div class="table"><table><tr><th>Employee</th><th>Status</th><th>Focus</th><th>Training</th></tr>'+d.team.map(x=>'<tr><td><b>'+x[0]+'</b></td><td><span class="status '+(x[1]==="On Track"?"good":x[1].includes("Training")?"warn":"bad")+'">'+x[1]+'</span></td><td>'+x[2]+'</td><td>'+x[3]+'%<div class="bar"><i style="width:'+x[3]+'%"></i></div></td></tr>').join("")+'</table></div></div>'}
function coaching(){return top("Team Coaching","Meaningful conversations. Clear commitments. Stronger performance.")+'<div class="grid4"><div class="card pad kpi"><b>Conversations</b><div class="metric">'+d.coach.length+'</div><div class="goal">This week</div></div><div class="card pad kpi"><b>Follow Ups</b><div class="metric">'+d.coach.filter(x=>x[4]==="Follow Up").length+'</div><div class="goal">Due</div></div><div class="card pad kpi"><b>Overdue</b><div class="metric">'+d.coach.filter(x=>x[4]==="Overdue").length+'</div><div class="goal">Needs attention</div></div><div class="card pad kpi"><b>Team Covered</b><div class="metric">'+new Set(d.coach.map(x=>x[0])).size+'/'+d.team.length+'</div><div class="goal">Members</div></div></div><div class="card pad" style="margin-top:15px"><div class="head"><h2>Coaching tracker</h2><button class="btn" onclick="addC()">+ Add Coaching</button></div><div class="table"><table><tr><th>Employee</th><th>Focus</th><th>Next Step</th><th>Follow Up</th><th>Status</th></tr>'+d.coach.map(x=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td><td>'+x[3]+'</td><td><span class="status '+(x[4]==="Overdue"?"bad":x[4]==="Follow Up"?"warn":"good")+'">'+x[4]+'</span></td></tr>').join("")+'</table></div></div>'}
function training(){let p=Math.round(d.train.reduce((a,x)=>a+x[2],0)/d.train.length);return top("Team Training","Build skills. Track progress. Keep everyone ready.")+'<div class="grid4"><div class="card pad kpi"><b>On Track</b><div class="metric">'+d.train.filter(x=>x[2]>=80).length+'</div><div class="goal">Assignments</div></div><div class="card pad kpi"><b>In Progress</b><div class="metric">'+d.train.filter(x=>x[3]==="In Progress").length+'</div><div class="goal">Assignments</div></div><div class="card pad kpi"><b>Not Started</b><div class="metric">'+d.train.filter(x=>x[3]==="Not Started").length+'</div><div class="goal">Assignments</div></div><div class="card pad kpi"><b>Overall</b><div class="metric">'+p+'%</div><div class="goal">Average completion</div></div></div><div class="card pad" style="margin-top:15px"><div class="head"><h2>Training tracker</h2><button class="btn" onclick="addR()">+ Add Training</button></div><div class="table"><table><tr><th>Employee</th><th>Training</th><th>Progress</th><th>Status</th><th>Due</th></tr>'+d.train.map((x,i)=>'<tr><td><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td><b>'+x[2]+'%</b><div class="bar"><i class="'+(x[2]<70?"bad":x[2]<80?"warn":"")+'" style="width:'+x[2]+'%"></i></div></td><td><span class="status '+(x[3]==="Not Started"?"bad":x[3]==="In Progress"?"warn":"good")+'">'+x[3]+'</span></td><td>'+x[4]+'</td></tr>').join("")+'</table></div></div>'}
function huddle(){return top("Today’s Team Huddle","Align. Motivate. Win the day.")+'<div class="card pad"><div class="huddle"><div class="label">TODAY’S FOCUS</div><h2>'+d.h[0]+'</h2><div class="sub">'+d.h[1]+'</div></div><div class="hgrid"><div class="hbox"><b>Team Challenge</b><strong>'+d.h[2]+'</strong></div><div class="hbox"><b>Recognition</b><strong>'+d.h[3]+'</strong></div></div></div><div class="card pad" style="margin-top:15px"><div class="head"><h2>Today’s action items</h2></div><div class="action"><span class="check"></span>Review yesterday’s results</div><div class="action"><span class="check"></span>Share today’s focus</div><div class="action"><span class="check"></span>Ask for team commitments</div></div>'}
function settings(){return top("Settings","Set the rules once. Use them everywhere.")+'<div class="card pad"><div class="head"><h2>Manager & KPI goals</h2></div><div class="two"><div><label>Manager name</label><input id="m" value="'+d.manager+'"></div><div><label>Sales goal</label><input id="sg" type="number" value="'+d.salesGoal+'"></div><div><label>Conversion goal %</label><input id="cg" type="number" value="'+d.convGoal+'"></div><div><label>Avg. transaction goal</label><input id="ag" type="number" value="'+d.atvGoal+'"></div><div><label>CX goal %</label><input id="xg" type="number" value="'+d.cxGoal+'"></div></div><button class="btn" style="margin-top:15px" onclick="saveSet()">Save Settings</button></div>'}
function start(){return top("Start Here","Set up once. Then let the dashboard do the thinking.")+'<div class="two"><div class="card pad"><div class="head"><h2>1. Set your goals</h2></div><p class="sub">Open Settings and enter the KPIs that matter.</p><button class="btn" onclick="go(\'settings\')">Open Settings</button></div><div class="card pad"><div class="head"><h2>2. Add your team</h2></div><p class="sub">Start with names, focus areas and training progress.</p><button class="btn" onclick="go(\'team\')">Open Team</button></div></div><div class="card pad" style="margin-top:15px"><h2>Simple surface. Smart underneath.</h2><p class="sub">The manager sees the answer first and the detail only when needed.</p></div>'}
const pages={dashboard:dash,daily,team,coaching,training,huddle,settings,start};const labels={dashboard:"⌂ Dashboard",daily:"▥ Daily KPI",team:"♙ Team",coaching:"▢ Coaching",training:"◆ Training",huddle:"☼ Huddle",settings:"⚙ Settings",start:"? Start Here"};function go(id){location.hash=id}function render(){let id=location.hash.slice(1)||"dashboard";if(!pages[id])id="dashboard";document.getElementById("pages").innerHTML='<section class="page active">'+pages[id]()+'</section>';document.getElementById("nav").innerHTML=Object.keys(labels).map(x=>'<button class="nav '+(x===id?"active":"")+'" onclick="go(\''+x+'\')">'+labels[x]+'</button>').join("")}function addK(){d.k.push({sales:0,conv:0,atv:0,cx:0});save();render()}function addT(){let n=prompt("Team member name");if(n){d.team.push([n,"On Track","Set focus area",0]);save();render()}}function addC(){let n=prompt("Employee name");if(n){d.coach.push([n,"Focus area","Next step","Next week","Follow Up"]);save();render()}}function addR(){let n=prompt("Employee name");if(n){d.train.push([n,"New training",0,"Not Started","Set date"]);save();render()}}function saveSet(){d.manager=document.getElementById("m").value;d.salesGoal=+document.getElementById("sg").value;d.convGoal=+document.getElementById("cg").value;d.atvGoal=+document.getElementById("ag").value;d.cxGoal=+document.getElementById("xg").value;save();render()}window.addEventListener("hashchange",render);render();
</script></body></html>
